# env    : prod  (namespace sso-ms-prod)
# dataId : meeting.yaml
# group  : SSO
# Prod DB endpoint/account are delivered by Nacos; the password is injected from the environment.
# IMPORTANT: keep this file pure ASCII. Spring reads the fetched content with the JVM
#            default charset (GBK on zh-CN Windows); non-ASCII bytes make snakeyaml fail.
spring:
  datasource:
    url: jdbc:mysql://172.17.0.1:3306/polaris_meetingroom?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: polaris
    password: ${MEETING_DB_PASSWORD}
  sql:
    init:
      mode: never
