# env    : prod  (namespace sso-ms-prod)
# dataId : sso-gateway.yaml
# group  : SSO
# Secrets are AES-GCM ciphertext (ENC + base64 payload), see polaris-nacos/README.md.
# The master key exists ONLY in the SSO_CONF_KEY environment variable / .env file.
# IMPORTANT: keep this file pure ASCII. Spring reads the fetched content with the JVM
#            default charset (GBK on zh-CN Windows); non-ASCII bytes make snakeyaml fail
#            with MalformedInputException and the config silently falls back to the jar.

# WARNING: spring.cloud.gateway.routes is a List; a list from Nacos REPLACES the whole
#          default list from the jar, so every route must be listed here.

spring:
  cloud:
    gateway:
      routes:
        - id: sso-auth
          uri: lb://sso-auth
          predicates:
            - Path=/api/auth/**
        - id: sso-account
          uri: lb://sso-account
          predicates:
            - Path=/api/accounts/**,/api/roles/**,/api/permissions/**,/api/applications/**
        # CMS legacy static media links -> unified file service (must precede the cms route)
        - id: cms-file-legacy
          order: -1
          uri: lb://file
          predicates:
            - Path=/api/cms/media/file/**
        # Forum inline images embedded in post HTML -> unified file service legacy endpoint.
        # Must precede the /api/forum/** route (live Nacos keeps that route outside this template).
        - id: forum-file-legacy
          order: -1
          uri: lb://file
          predicates:
            - Path=/api/forum/media/file/**
        - id: cms
          uri: lb://cms
          predicates:
            - Path=/api/cms/**
        - id: portal
          uri: lb://portal
          predicates:
            - Path=/api/portal/**
        - id: file
          uri: lb://file
          predicates:
            - Path=/api/file/**
        - id: audit
          uri: lb://audit
          predicates:
            - Path=/api/audit/**

sso:
  gateway:
    issuer: sso-auth
    # how often to poll the revocation list from auth (smaller = faster logout, more load)
    revocation-sync-millis: 5000
    # unified audit fallback: every verified request is reported to audit-server /internal/audit/event
    audit:
      enabled: true
      audit-url: lb://audit
      internal-token: ${SSO_INTERNAL_TOKEN:}
    # lb:// prefix switches RevocationCache to the load-balanced WebClient
    auth-base-url: lb://sso-auth
    # prod verifies with the prod public key above, matching sso-auth.yaml
    public-key: |
      -----BEGIN PUBLIC KEY-----
      MIIBIjANBgkqhkiG9w0BAQEFAAOCAQ8AMIIBCgKCAQEAoMbVEy4Va5R6LRNVPx6r
