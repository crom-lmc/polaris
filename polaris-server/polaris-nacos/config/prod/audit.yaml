# env    : prod  (namespace sso-ms-prod)
# dataId : audit.yaml
# group  : SSO
# 生产库地址/账号由 Nacos 直接下发；密码在服务器发布时取自 sso-account.yaml，不入库。
spring:
  datasource:
    url: jdbc:mysql://172.17.0.1:3306/polaris_audit?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: polaris
    password: ${AUDIT_DB_PASSWORD}
  sql:
    init:
      # 生产库由部署脚本用 schema.sql 初始化；data.sql 为空脚本，避免 always 触发 Spring 空脚本错误
      mode: never

# 审计服务自身关闭系统日志采集：避免「写入 system_log 的日志」被再次采集形成自我循环。
# schema.sql 的 system_log 表由部署脚本初始化。
polaris:
  system-log:
    enabled: false

# 单点换票：audit 作为 OAuth 客户端入驻统一登录中心。
# app-secret 不入库，由容器环境变量 SSO_AUDIT_APP_SECRET 注入
# （值取 sso_ms.sso_application 中 code=audit 的 app_secret；与 file 应用同口径）。
sso:
  audit:
    app-code: ${SSO_AUDIT_APP_CODE:audit}
    app-secret: ${SSO_AUDIT_APP_SECRET:}
