server:
  # 对外唯一入口。8080 在本机已被其他 Java 进程占用，故模板用 9080
  port: ${SSO_GATEWAY_PORT:9080}

spring:
  application:
    name: sso-gateway
  config:
    # 关键：optional: 前缀。没有 Nacos 时自动回退到本文件，服务照常启动
    import: "optional:nacos:sso-gateway.yaml?group=${SSO_NACOS_GROUP:SSO}&refreshEnabled=true"
  cloud:
    nacos:
      # 地址/账号两级环境变量：SSO_NACOS_* 优先，其次复用本机已有的 NACOS_*（与博客后端同一套）
      server-addr: ${SSO_NACOS_ADDR:${NACOS_SERVER_ADDR:127.0.0.1:8848}}
      username: ${SSO_NACOS_USER:${NACOS_USERNAME:nacos}}
      password: ${SSO_NACOS_PASSWORD:${NACOS_PASSWORD:}}
      config:
        enabled: ${SSO_NACOS_ENABLED:false}
        # 环境靠命名空间隔离：local → sso-ms-local，prod → sso-ms-prod，dataId 两边同名
        namespace: ${SSO_NACOS_NAMESPACE:sso-ms-local}
        group: ${SSO_NACOS_GROUP:SSO}
        file-extension: yaml
        refresh-enabled: true
      discovery:
        enabled: ${SSO_NACOS_DISCOVERY:false}
        group: ${SSO_NACOS_GROUP:SSO}
        namespace: ${SSO_NACOS_NAMESPACE:sso-ms-local}
    gateway:
      routes:
        - id: sso-auth
          # 直连默认；接服务发现时设 SSO_AUTH_ROUTE=lb://sso-auth（需 SSO_NACOS_DISCOVERY=true）
          uri: ${SSO_AUTH_ROUTE:http://127.0.0.1:9001}
          predicates:
            - Path=/api/auth/**
        - id: sso-account
          uri: ${SSO_ACCOUNT_ROUTE:http://127.0.0.1:9002}
          predicates:
            - Path=/api/accounts/**,/api/roles/**,/api/permissions/**,/api/applications/**
        # 接口开放平台：第三方进出 + 管理端（管理端由网关注入 X-Account-* 头，openapi 服务按 @Permit 校验）
        - id: openapi
          uri: ${OPENAPI_ROUTE:http://127.0.0.1:9010}
          predicates:
            - Path=/api/open/**
        # CMS 历史静态直链（正文内嵌的旧路径）：统一切到 file-service 的 legacy 端点，
        # 由 file_alias 映射到迁移后的文件；必须排在 cms 路由之前，否则会被 /api/cms/** 先匹配。
        - id: cms-file-legacy
          order: -1
          uri: ${FILE_ROUTE:http://127.0.0.1:9011}
          predicates:
            - Path=/api/cms/media/file/**
        # 业务应用：CMS 内容管理端
        - id: cms
          uri: ${CMS_ROUTE:http://127.0.0.1:9004}
          predicates:
            - Path=/api/cms/**
        # 业务应用：内容门户
        - id: portal
          uri: ${PORTAL_ROUTE:http://127.0.0.1:9005}
          predicates:
            - Path=/api/portal/**
        # 业务应用：EHR 人力（组织架构/人员/请假）
        - id: ehr
          uri: ${EHR_ROUTE:http://127.0.0.1:9006}
          predicates:
            - Path=/api/ehr/**
        # 业务应用：配置中心（枚举型基础信息）
        - id: settings
          uri: ${SETTINGS_ROUTE:http://127.0.0.1:9007}
          predicates:
            - Path=/api/settings/**
        # 业务应用：调度中心（P6，定时任务管理台）
        - id: job
          uri: ${JOB_ROUTE:http://127.0.0.1:9008}
          predicates:
            - Path=/api/jobs/**
        # 论坛正文插图稳定直链（编辑器/正文内嵌）：统一切到 file-service 的 legacy 端点，
        # 由 file_alias 按路径读回；必须排在 forum 路由之前，否则会被 /api/forum/** 先匹配。
        - id: forum-file-legacy
          order: -1
          uri: ${FILE_ROUTE:http://127.0.0.1:9011}
          predicates:
            - Path=/api/forum/media/file/**
        # 独立社区论坛：公开内容、登录互动与积分交易
        - id: forum
          uri: ${FORUM_ROUTE:http://127.0.0.1:9009}
          predicates:
            - Path=/api/forum/**
        # 统一文件服务：管理端 + 公开/私有文件读取（管理端由网关注入 X-Account-* 头）
        - id: file
          uri: ${FILE_ROUTE:http://127.0.0.1:9011}
          predicates:
            - Path=/api/file/**
        # 统一审计中心：管理端接口（网关注入 X-Account-* 头，audit-server 按 audit:* 鉴权）
        - id: audit
          uri: ${AUDIT_ROUTE:http://127.0.0.1:9012}
          predicates:
            - Path=/api/audit/**
        # 会议室管理（北极星会）：所有 API 均需登录，不在网关白名单放行
        - id: meeting
          uri: ${MEETING_ROUTE:http://127.0.0.1:9013}
          predicates:
            - Path=/api/meetingroom/**

sso:
  gateway:
    issuer: sso-auth
    public-key: ${SSO_JWT_PUBLIC_KEY:classpath:keys/jwt-public.pem}
    auth-base-url: ${SSO_AUTH_URL:http://127.0.0.1:9001}
    # 登出后最长多少毫秒内失效；越小越及时，越大对 auth 压力越小
    revocation-sync-millis: 5000
    # 统一审计兜底：验签通过的请求全部经 WebClient 异步上报 audit-server 的 /internal/audit/event
    audit:
      enabled: ${SSO_AUDIT_ENABLED:true}
      audit-url: ${AUDIT_SERVICE_URL:http://127.0.0.1:9012}
      internal-token: ${SSO_INTERNAL_TOKEN:}

# 调度中心：本应用上报 JobHandler 清单并接收中心触发（不再使用本地 @Scheduled）
job:
  client:
    center-url: ${JOB_CENTER_URL:http://127.0.0.1:9008}
    internal-token: ${SSO_INTERNAL_TOKEN:}
  executor:
    app-code: gateway
    # 中心派发时带的 X-Job-Token，需与中心 job.executor.token 一致
    token: ${SSO_INTERNAL_TOKEN:}

# 系统日志采集（polaris-common 自动装配）：网关排查价值最高，单独放开 INFO；其他服务默认 WARN。
# 地址与内部令牌从 AUDIT_SERVICE_URL / SSO_INTERNAL_TOKEN 环境变量兜底读取。
polaris:
  system-log:
    min-level: INFO

logging:
  level:
    com.laimengchao.sso: INFO
